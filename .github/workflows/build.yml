name: Build NetHunter Kernel Auto-Detect
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          repository: Iam-nishan/jujutsu-kernel
          ref: V6
          submodules: false

      - name: Remove broken submodules
        run: rm -f .gitmodules

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip unzip python3 cpio git wget gcc-aarch64-linux-gnu

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/Iam-nishan/anykernel.git anykernel

      - name: Download Clang Toolchain
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang

      - name: Patch Source Code (Bypass Error Linker)
        run: |
          # 1. Perbaiki nama totalram_pages menjadi _totalram_pages
          sed -i 's/\btotalram_pages\b/_totalram_pages/g' kernel/fork.c mm/oom_kill.c mm/page_alloc.c
          
          # 2. HAPUS panggilan fungsi simple_lmk_mm_freed yang tidak ada
          sed -i 's/^\s*simple_lmk_mm_freed(mm);.*$//g' kernel/fork.c
          
          # 3. HAPUS panggilan fungsi reclaim_pages_from_list yang tidak ada
          sed -i 's/^\s*reclaim_pages_from_list(.*$//g' fs/proc/task_mmu.c

      - name: Build Kernel & Fix Configs
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          rm -rf out
          
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- blossom_defconfig
          
          # Matikan LTO & aktifkan HID
          scripts/config --file out/.config -d LTO_CLANG -d LTO_CLANG_FULL -d LTO_CLANG_THIN -e LTO_NONE
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> out/.config
          echo "CONFIG_USB_CONFIGFS_F_MTP=y" >> out/.config
          
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          
          make O=out ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) 2>&1 | tee build.log

      - name: AUTO-DETECT & Package
        run: |
          if ! ls out/arch/arm64/boot/Image* 1> /dev/null 2>&1; then
            echo "KERNEL BUILD FAILED! No Image found."
            exit 1
          fi
          
          find out/arch/arm64/boot/ -name "Image*" -exec cp {} anykernel/ \;
          cd anykernel
          zip -r9 ../NetHunter-Kernel-Auto.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-Auto
          path: NetHunter-Kernel-Auto.zip
