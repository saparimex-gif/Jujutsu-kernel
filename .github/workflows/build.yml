name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build NetHunter Kernel
        uses: Theoldnation/kernel_action_mt6768@main
        with:
          KERNEL_SOURCE: https://github.com/Iam-nishan/jujutsu-kernel
          KERNEL_SOURCE_BRANCH: V6
          KERNEL_ARCH: arm64
          KERNEL_IMAGE_NAME: Image.gz-dtb
          ENABLE_KERNELSU: true
          KERNELSU_TAG: v0.9.5
          ADD_KPROBES_CONFIG: true
          KSU_HOOKS_PATCH: true
