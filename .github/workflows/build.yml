name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    # Kita pakai Ubuntu 20.04 agar tidak error libpcre3
    runs-on: ubuntu-22.04
    steps:
      - name: Build NetHunter Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/Iam-nishan/jujutsu-kernel
          kernel-branch: V6
          config: blossom_defconfig
          arch: arm64
          android-version: 15
          nethunter: true
          nethunter-patch: true
          anykernel3: true
          anykernel3-url: https://github.com/Iam-nishan/anykernel.git
          kernel-image: Image.gz-dtb
          disable-lto: true
          extra-make-args: '["CONFIG_ANDROID_SIMPLE_LMK=n", "CONFIG_PROCESS_RECLAIM=n"]'
