name: Build NetHunter Kernel
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build NetHunter Kernel
        uses: yanhuo26/action-build-kernel@main
        with:
          kernel-url: https://github.com/Iam-nishan/jujutsu-kernel
          kernel-branch: V6
          config: blossom_defconfig
          arch: arm64
          android-version: 15
          nethunter: true
