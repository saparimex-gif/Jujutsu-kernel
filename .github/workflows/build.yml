name: Build NetHunter Kernel Auto-Detect
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v3
        with:
          repository: Iam-nishan/jujutsu-kernel
          ref: V6
          submodules: false

      - name: Remove broken submodules
        run: rm -f .gitmodules

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zip unzip python3 cpio git wget

      - name: Clone AnyKernel3
        run: |
          git clone https://github.com/Iam-nishan/anykernel.git anykernel

      - name: Download Clang Toolchain
        run: |
          mkdir clang && cd clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r487747c.tar.gz
          tar -xzf clang-r487747c.tar.gz && cd ..

      - name: Apply NetHunter Configs
        run: |
          # Mengambil patch NetHunter untuk Redmi 9A dari repo deepcomon
          wget -q https://raw.githubusercontent.com/deepcomon/kernel-nethunter-for-Redmi-9A/main/nethunter_fragment.cfg
          cat nethunter_fragment.cfg >> arch/arm64/configs/blossom_defconfig
          # Menambahkan konfigurasi HID Keyboard & USB gadget
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/blossom_defconfig
          echo "CONFIG_USB_CONFIGFS_F_MTP=y" >> arch/arm64/configs/blossom_defconfig

      - name: Build Kernel
        run: |
          export PATH=$PWD/clang/bin:$PATH
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          make O=out blossom_defconfig
          make O=out -j$(nproc) 2>&1 | tee build.log

      - name: AUTO-DETECT & Package
        run: |
          # INI DIA JURUS AUTO-DETECT NYA:
          # Mencari file apapun yang berawalan "Image" di folder output
          find out/arch/arm64/boot/ -name "Image*" -exec cp {} anykernel/ \;
          cd anykernel
          zip -r9 ../NetHunter-Kernel-Auto.zip * -x .git README.md *placeholder

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: NetHunter-Kernel-Auto
          path: NetHunter-Kernel-Auto.zip
